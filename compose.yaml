services:
  db:
    image: postgres:16
    restart: unless-stopped
    pull_policy: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifeforest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeforest123}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:-tiffanyphelipa/lifeforest-backend:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-lifeforest}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lifeforest123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      DOWNLOAD_PAGE_TITLE: ${DOWNLOAD_PAGE_TITLE:-LifeForest}
      DOWNLOAD_PAGE_DESCRIPTION: ${DOWNLOAD_PAGE_DESCRIPTION:-Download the latest Android APK for LifeForest.}
      APK_DOWNLOAD_URL: ${APK_DOWNLOAD_URL:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
