sonar.projectKey=LifeForest
sonar.projectName=LifeForest
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,backend/src/main/resources,frontend/app,frontend/components,frontend/constants,frontend/hooks,frontend/services
sonar.tests=backend/src/test/java

sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.junit.reportPaths=backend/build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

sonar.exclusions=**/node_modules/**,**/build/**,**/.expo/**,**/dist/**,frontend/android/**,frontend/ios/**,backend/sql/**
