name: LifeForest CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew assemble

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: backend-build-artifacts
          path: backend/build/libs/*.jar

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-build

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test

      - name: Run OWASP Dependency-Check
        run: ./gradlew dependencyCheckAnalyze || true

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-owasp-dependency-check
          path: backend/build/reports/dependency-check-report.*

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend type check
        run: npm run typecheck

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests if present
        run: npm run test --if-present

      - name: Run frontend dependency audit
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json || true

      - name: Upload frontend dependency audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-npm-audit
          path: frontend/npm-audit.json

  sonarqube:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Check SonarQube secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "SonarCloud secrets are not fully configured. Skipping analysis."
            exit 0
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate backend coverage report
        working-directory: backend
        run: ./gradlew test jacocoTestReport prepareSonarLibraries prepareSonarTestLibraries

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
