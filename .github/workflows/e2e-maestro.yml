name: Mobile E2E

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public or signed URL to the APK that Maestro should test
        required: true
        type: string

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Maestro secrets
        id: maestro-check
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
          MAESTRO_PROJECT_ID: ${{ secrets.MAESTRO_PROJECT_ID }}
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
        run: |
          if [ -z "$MAESTRO_API_KEY" ] || [ -z "$MAESTRO_PROJECT_ID" ] || [ -z "$E2E_LOGIN_EMAIL" ] || [ -z "$E2E_LOGIN_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Maestro or E2E login secrets are missing. Skipping mobile E2E run."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Download APK under test
        if: steps.maestro-check.outputs.configured == 'true'
        run: curl -L "${{ github.event.inputs.apk_url }}" --output lifeforest-under-test.apk

      - name: Run Maestro Cloud smoke flow
        if: steps.maestro-check.outputs.configured == 'true'
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: lifeforest-under-test.apk
          workspace: .maestro
          include-tags: smoke
          timeout: 30
          env: |
            LOGIN_EMAIL=${{ secrets.E2E_LOGIN_EMAIL }}
            LOGIN_PASSWORD=${{ secrets.E2E_LOGIN_PASSWORD }}
            ROUTINE_TITLE=E2E Routine ${{ github.run_number }}
            ROUTINE_DESCRIPTION=Created by Maestro cloud smoke test.
            TASK_TITLE=E2E Task ${{ github.run_number }}
            TASK_DESCRIPTION=Task created during the interrupted session smoke flow.
            REFLECTION_TEXT=The interrupted session should open reflection automatically.
            DISTRACTION_TEXT=Notification interruption during smoke validation.
